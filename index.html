<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<title>RUSTAM OS — Football Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">R</div><div><b>RUSTAM OS</b><span>FOOTBALL INTELLIGENCE</span></div></div>
    <button class="round" id="refresh">↻</button>
  </header>

  <main>
    <section class="hero">
      <div><span class="eyebrow">MATCH CENTER</span><h1 id="title">Выбери матч</h1><p id="subtitle">Загружаем данные аналитического движка…</p></div>
      <div class="status"><i></i> DATA ENGINE ONLINE</div>
    </section>

    <section class="match-card" id="matchCard">
      <div class="league"><span>UEFA CHAMPIONS LEAGUE</span><em id="kickoff">—</em></div>
      <div class="teams">
        <div class="team"><div class="crest"><img id="homeLogo" alt=""></div><b id="homeName">Home</b><small>HOME</small></div>
        <div class="score"><strong id="score">—</strong><span id="dateText">PRE-MATCH</span></div>
        <div class="team"><div class="crest"><img id="awayLogo" alt=""></div><b id="awayName">Away</b><small>AWAY</small></div>
      </div>
      <div class="match-meta"><span id="venue">Fixture intelligence</span><span id="fixtureId">ID —</span></div>
    </section>

    <nav class="tabs" id="tabs">
      <button class="active" data-tab="prediction">🎯 Прогноз</button>
      <button data-tab="form">📈 Форма</button>
      <button data-tab="h2h">🤝 H2H</button>
      <button data-tab="table">🏆 Таблица</button>
      <button data-tab="odds">💰 Odds</button>
      <button data-tab="risk">⚠️ Риск</button>
    </nav>

    <section id="content" class="content">
      <div class="loading"><div class="spinner"></div><b>RUSTAM ENGINE</b><span>Получаем реальные данные…</span></div>
    </section>
  </main>

  <footer>RUSTAM OS · DATA-DRIVEN FOOTBALL INTELLIGENCE</footer>
</div>
<script src="./app.js"></script>
</body>
</html>
